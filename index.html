<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Núcleo</title>
    <script>
      // Aplica el tema guardado antes del primer render para evitar el destello claro/oscuro.
      try {
        var saved = JSON.parse(localStorage.getItem("ddl-ui") || "{}");
        if (saved.state && saved.state.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
