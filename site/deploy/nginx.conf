# Web de descarga de Núcleo en un VPS con nginx.
# Subdominio de KiboCode. Cambia la ruta de "root" si subes la web a otra carpeta.
# Copia este archivo a /etc/nginx/sites-available/nucleo, enlázalo en
# sites-enabled y saca el certificado HTTPS con:  sudo certbot --nginx -d nucleo.kibocode.lat
#
# HTTPS es obligatorio: Chrome y Edge bloquean como «descarga no segura» los .exe
# que se sirven por http.

server {
    listen 80;
    listen [::]:80;
    server_name nucleo.kibocode.lat;
    return 301 https://nucleo.kibocode.lat$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nucleo.kibocode.lat;

    # Rutas que crea certbot; si usas otro certificado, cámbialas.
    ssl_certificate     /etc/letsencrypt/live/nucleo.kibocode.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nucleo.kibocode.lat/privkey.pem;

    root  /var/www/nucleo;
    index index.html;

    # Cabeceras de seguridad (la página no carga nada de fuera: ni fuentes, ni analíticas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # El instalador: siempre se descarga (nunca se abre en el navegador) y sin caché,
    # para que al publicar una versión nueva el enlace dé enseguida la última.
    location /descargar/ {
        types { application/vnd.microsoft.portable-executable exe; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # CSS, JS, icono y fuente llevan ?v=<versión>: se pueden cachear una semana.
    location ~* \.(css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
